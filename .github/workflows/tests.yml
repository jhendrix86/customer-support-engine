name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Run tests
        # tests/conftest.py's session _dispose_async_engine fixture is the
        # real unhang (aiosqlite's non-daemon worker thread otherwise keeps
        # the pytest process alive past the last test -> CI step waits on
        # the stdout pipe to the job cap). --timeout / timeout-minutes are
        # just backstops so any future hang self-diagnoses instead of
        # burning the full job budget.
        run: pytest -q --timeout=120 --timeout-method=thread
