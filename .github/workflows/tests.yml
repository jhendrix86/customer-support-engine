name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Run tests
        # Redirect to a file, not the pipe: if the app leaves a non-daemon
        # background thread / undisposed async engine or client alive after
        # the test session, it holds the step's stdout pipe open in CI and
        # hangs the step until the job cap. A file fd doesn't block step exit.
        run: |
          pytest -q --timeout=120 --timeout-method=thread > pytest.out 2>&1; rc=$?
          cat pytest.out
          exit $rc
